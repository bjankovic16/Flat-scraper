name: Dnevna provera stanova

on:
  schedule:
    # 07:00 po srednjeevropskom vremenu (leti UTC+2 => 05:00 UTC, zimi UTC+1 => 06:00 UTC)
    # GitHub cron je uvek u UTC, ovde je podešeno na 06:00 UTC što je 07-08h kod nas.
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # omogućava ručno pokretanje sa "Run workflow" dugmeta

permissions:
  contents: write

concurrency:
  group: stan-watcher  # dva pokretanja odjednom bi se tukla oko commit-a
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaliraj zavisnosti
        run: pip install -r requirements.txt

      - name: Pokreni proveru
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scraper.py

      - name: Sačuvaj katalog oglasa nazad u repo
        run: |
          git config user.name "stan-watcher-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/listings.json
          git diff --staged --quiet && exit 0
          git commit -m "Ažuriranje kataloga oglasa [skip ci]"

          # Veb aplikacija upisuje config.json u istu granu dok mi radimo, pa
          # push ume da bude odbijen. Rebase-ujemo i probamo ponovo; kod sudara
          # na katalogu merodavan je onaj koji je skripta upravo napravila
          # (-X theirs se u rebase-u odnosi na commit koji se primenjuje).
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Push uspeo iz pokušaja ${attempt}."
              exit 0
            fi
            echo "Push odbijen — rebase pa ponovo (pokušaj ${attempt})."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" || {
              git rebase --abort
              sleep 5
            }
          done
          echo "Katalog nije sačuvan posle 3 pokušaja."
          exit 1
